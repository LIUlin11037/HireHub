server:
  port: 9001

spring:
  application:
    name: hirehub-auth
  datasource:
    url: jdbc:mysql://localhost:3307/hirehub_auth?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  # 三期：refresh token 白名单 + access token 黑名单（D-02）
  data:
    redis:
      host: localhost
      port: 6379
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
        username: nacos
        password: "${NACOS_PASSWORD:nacos}"
# JWT 配置：生产用环境变量 HIREHUB_JWT_SECRET 覆盖（secret 需 ≥ 32 字节）
hirehub:
  jwt:
    secret: ${HIREHUB_JWT_SECRET:hirehub-dev-secret-please-override-0123456789}
    access-expire-seconds: 1800        # 30min
    refresh-expire-seconds: 604800     # 7d

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

management:
  tracing:
    sampling:
      probability: 1.0   # 开发期全采样，生产按需调低

logging:
  # 落盘一份：traceId 排障 / 脚本化验证不需要盯着 IDEA 控制台（工作目录 = 项目根目录）
  file:
    name: logs/${spring.application.name}.log
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}] %-15.15t %-40.40logger{39} : %m%n%wEx"

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
