server:
  port: 9000

spring:
  application:
    name: hirehub-gateway
  # 三期：查 access token 黑名单（D-02）
  data:
    redis:
      host: localhost
      port: 6379
  cloud:
    nacos:
      username: nacos
      password: "${NACOS_PASSWORD:nacos}"
      discovery:
        server-addr: localhost:8848
    gateway:
      routes:
        - id: hirehub-auth
          uri: lb://hirehub-auth
          predicates:
            - Path=/api/auth/**
        - id: hirehub-company
          uri: lb://hirehub-company
          predicates:
            - Path=/api/company/**
        - id: hirehub-job
          uri: lb://hirehub-job
          predicates:
            - Path=/api/job/**
        - id: hirehub-resume
          uri: lb://hirehub-resume
          predicates:
            - Path=/api/resume/**
        - id: hirehub-delivery
          uri: lb://hirehub-delivery
          predicates:
            - Path=/api/delivery/**
        - id: hirehub-interview
          uri: lb://hirehub-interview
          predicates:
            - Path=/api/interview/**
        - id: hirehub-notification
          uri: lb://hirehub-notification
          predicates:
            - Path=/api/notification/**
        # 三期：WebSocket 站内消息（见 D-34）。
        # uri 必须用 ws://（不是 http://），网关才会按 WebSocket 协议做升级转发。
        - id: hirehub-notification-ws
          uri: lb:ws://hirehub-notification
          predicates:
            - Path=/ws/**
    # 二期：Sentinel 入口限流（见 §8.3）
    sentinel:
      eager: true                       # 启动即初始化，避免懒加载导致规则不生效
      transport:
        dashboard: localhost:8858       # 控制台（可选，不启动不影响规则）
      # ⚠️ 这里**故意不再配 datasource**（踩坑记录 #20 及续集）：
      # SCA 对 rule-type: gw-flow 会把规则注册到错误的规则管理器 —— 实测表现为
      # 被拦时抛 ParamFlowException（热点参数限流），由 SentinelWebFluxFilter 拦下、
      # 最终被兜成 HTTP 500，而不是走 SentinelGatewayFilter 的 429 处理器。
      # 规则改由 GatewayFlowRuleDataSourceConfig 用 Sentinel 原生 API 直接接入
      # GatewayRuleManager，Nacos 坐标见下面 hirehub.sentinel.nacos。

# JWT secret 必须与 auth 服务一致（同一环境变量 + 同一默认值）
hirehub:
  jwt:
    secret: ${HIREHUB_JWT_SECRET:hirehub-dev-secret-please-override-0123456789}
    access-expire-seconds: 1800
  # 三期：网关限流规则的 Nacos 坐标（由 GatewayFlowRuleDataSourceConfig 读取）
  sentinel:
    nacos:
      server-addr: localhost:8848
      username: nacos
      password: "${NACOS_PASSWORD:nacos}"
      group-id: DEFAULT_GROUP
      data-id: hirehub-gateway-flow

management:
  tracing:
    sampling:
      probability: 1.0   # 开发期全采样，生产按需调低

logging:
  # 落盘一份：traceId 排障 / 脚本化验证不需要盯着 IDEA 控制台（工作目录 = 项目根目录）
  file:
    name: logs/${spring.application.name}.log
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}] %-15.15t %-40.40logger{39} : %m%n%wEx"
    # ⚠️ 必须单独配 file：只配 console 时，文件 appender 用的是 Boot 默认 pattern，
    # 里面没有 traceId —— 之前据此判断"traceId 没生效"是错误的（见踩坑记录 #21）。
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} %5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}] %-15.15t %-40.40logger{39} : %m%n%wEx"