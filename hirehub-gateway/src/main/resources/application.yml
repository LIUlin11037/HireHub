server:
  port: 9000

spring:
  application:
    name: hirehub-gateway
  cloud:
    nacos:
      username: nacos
      password: "${NACOS_PASSWORD:nacos}"
      discovery:
        server-addr: localhost:8848
    gateway:
      routes:
        - id: hirehub-auth
          uri: lb://hirehub-auth
          predicates:
            - Path=/api/auth/**
        - id: hirehub-company
          uri: lb://hirehub-company
          predicates:
            - Path=/api/company/**
        - id: hirehub-job
          uri: lb://hirehub-job
          predicates:
            - Path=/api/job/**
        - id: hirehub-resume
          uri: lb://hirehub-resume
          predicates:
            - Path=/api/resume/**
        - id: hirehub-delivery
          uri: lb://hirehub-delivery
          predicates:
            - Path=/api/delivery/**
        - id: hirehub-interview
          uri: lb://hirehub-interview
          predicates:
            - Path=/api/interview/**
        - id: hirehub-notification
          uri: lb://hirehub-notification
          predicates:
            - Path=/api/notification/**
    # 二期：Sentinel 入口限流（见 §8.3）
    sentinel:
      eager: true                       # 启动即初始化，避免懒加载导致规则不生效
      transport:
        dashboard: localhost:8858       # 控制台（可选，不启动不影响规则）
      datasource:
        flow:
          nacos:
            server-addr: localhost:8848
            username: nacos
            password: "${NACOS_PASSWORD:nacos}"
            data-id: hirehub-gateway-flow
            group-id: DEFAULT_GROUP
            # 网关用 GatewayFlowRule（gw-flow）；写成 flow 规则进的是普通 FlowRule，对路由不生效
            rule-type: gw-flow

# JWT secret 必须与 auth 服务一致（同一环境变量 + 同一默认值）
hirehub:
  jwt:
    secret: ${HIREHUB_JWT_SECRET:hirehub-dev-secret-please-override-0123456789}
    access-expire-seconds: 1800

management:
  tracing:
    sampling:
      probability: 1.0   # 开发期全采样，生产按需调低

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}] %-15.15t %-40.40logger{39} : %m%n%wEx"