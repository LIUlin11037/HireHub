server:
  port: 9007

spring:
  application:
    name: hirehub-notification
  datasource:
    url: jdbc:mysql://localhost:3307/hirehub_notification?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  cloud:
    nacos:
      username: nacos
      password: "${NACOS_PASSWORD:nacos}"
      discovery:
        server-addr: localhost:8848
  # 二期：消费投递域消息生成站内通知（见架构文档 §6.4）
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    listener:
      simple:
        acknowledge-mode: manual   # 处理成功才 ACK，配合 mq_consume_log 幂等
        prefetch: 10
  # 三期：ws-ticket 存储 + 多实例长连接消息路由（见 D-34）
  data:
    redis:
      host: localhost
      port: 6379

hirehub:
  ws:
    ticket-ttl-seconds: 60        # 一次性票据有效期，够客户端握手即可
    heartbeat-seconds: 30         # 服务端 PING 间隔，用于清理半开连接

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

management:
  tracing:
    sampling:
      probability: 1.0   # 开发期全采样，生产按需调低

logging:
  # 落盘一份：traceId 排障 / 脚本化验证不需要盯着 IDEA 控制台（工作目录 = 项目根目录）
  file:
    name: logs/${spring.application.name}.log
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}] %-15.15t %-40.40logger{39} : %m%n%wEx"

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
