# HireHub 一期中间件编排：MySQL / Redis / Nacos
# 服务本身在 IDE 运行，中间件用 Docker 起
# 端口规划见 docs/架构与实施文档.md §3.2（Nacos 3.0 控制台独立到 8080，避开网关 9000）
services:
  mysql:
    image: mysql:8.0
    container_name: hirehub-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      TZ: Asia/Shanghai
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: hirehub-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  nacos:
    image: nacos/nacos-server:v3.0.3
    container_name: hirehub-nacos
    restart: unless-stopped
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "true"
      JVM_XMS: 512m
      JVM_XMX: 512m
      JVM_XMN: 256m
      NACOS_AUTH_TOKEN: "SecretKey012345678901234567890123456789012345678901234567890123456789"
      NACOS_AUTH_IDENTITY_KEY: "serverIdentity"
      NACOS_AUTH_IDENTITY_VALUE: "security"
      NACOS_CONSOLE_LOGIN_ENABLED: "true"
    ports:
      - "8848:8848"    # 主端口 / HTTP API
      - "9848:9848"    # 客户端 gRPC（必须放行）
      - "9849:9849"    # 服务端间 gRPC
      - "8080:8080"    # 控制台（Nacos 3.0 独立端口，不再是 8848/nacos）
    # healthcheck 待实际运行验证后补充（Nacos 3.0 健康端点与 2.x 不同）

  # ---------- 二期：Elasticsearch（职位/公司搜索，见架构文档 §6.3 / §9.1） ----------
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.14.3
    container_name: hirehub-es
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false      # 本地关闭 TLS + 账号密码（§9.3；生产必须开启）
      - xpack.security.http.ssl.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m    # 堆调小，避免吃掉宿主机内存（§9.2）
      - ingest.geoip.downloader.enabled=false
    ports:
      - "9200:9200"    # REST API
    volumes:
      - es-data:/usr/share/elasticsearch/data
    mem_limit: 2g
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20

  # ---------- 二期：MinIO（简历上传 + 预签名直传，见架构文档 §6.6 / §9.1） ----------
  minio:
    image: minio/minio:RELEASE.2024-01-16T16-07-38Z   # 固定 tag：daocloud 镜像源对 latest 返回 403
    container_name: hirehub-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9010:9000"    # S3 API
      - "9011:9001"    # 控制台
    volumes:
      - minio-data:/data
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 10

volumes:
  mysql-data:
  es-data:
  minio-data:
