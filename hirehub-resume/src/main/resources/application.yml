server:
  port: 9004

hirehub:
  minio:
    endpoint: http://localhost:9010
    access-key: minioadmin
    secret-key: minioadmin
    bucket: resume
  # 三期：简历解析结果索引（人才库检索，见 D-23）
  es:
    host: localhost
    port: 9200

spring:
  application:
    name: hirehub-resume
  datasource:
    url: jdbc:mysql://localhost:3307/hirehub_resume?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  cloud:
    nacos:
      username: nacos
      password: "${NACOS_PASSWORD:nacos}"
      discovery:
        server-addr: localhost:8848
  # 三期：附件上传确认后发 resume.parse，异步解析（见 Q-03）
  rabbitmq:
    host: localhost
    port: 5672
    # broker 已在容器里，跨容器连接不能用 guest（只允许 loopback）——
    # 见踩坑记录 #33 / ADR D-36。本地默认值可用环境变量覆盖。
    username: ${RABBITMQ_USERNAME:hirehub}
    password: ${RABBITMQ_PASSWORD:hirehub123}
    publisher-confirm-type: correlated
    listener:
      simple:
        acknowledge-mode: manual   # 处理成功才 ACK，配合 mq_consume_log 幂等
        prefetch: 5

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

management:
  tracing:
    sampling:
      probability: 1.0   # 开发期全采样，生产按需调低

logging:
  # 落盘一份：traceId 排障 / 脚本化验证不需要盯着 IDEA 控制台（工作目录 = 项目根目录）
  file:
    name: logs/${spring.application.name}.log
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}] %-15.15t %-40.40logger{39} : %m%n%wEx"

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
