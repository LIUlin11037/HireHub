server:
  port: 9002

hirehub:
  es:
    host: localhost
    port: 9200

spring:
  application:
    name: hirehub-company
  datasource:
    url: jdbc:mysql://localhost:3307/hirehub_company?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  cloud:
    nacos:
      username: nacos
      password: "${NACOS_PASSWORD:nacos}"
      discovery:
        server-addr: localhost:8848
  # 二期：企业变更 → MQ → ES 同步（见 §6.3）
  rabbitmq:
    host: localhost
    port: 5672
    # broker 已在容器里，跨容器连接不能用 guest（只允许 loopback）——
    # 见踩坑记录 #33 / ADR D-36。本地默认值可用环境变量覆盖。
    username: ${RABBITMQ_USERNAME:hirehub}
    password: ${RABBITMQ_PASSWORD:hirehub123}
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 10
  # 三期：成员关系缓存（见 D-06）
  data:
    redis:
      host: localhost
      port: 6379

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

management:
  tracing:
    sampling:
      probability: 1.0   # 开发期全采样，生产按需调低

logging:
  # 落盘一份：traceId 排障 / 脚本化验证不需要盯着 IDEA 控制台（工作目录 = 项目根目录）
  file:
    name: logs/${spring.application.name}.log
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}] %-15.15t %-40.40logger{39} : %m%n%wEx"

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
