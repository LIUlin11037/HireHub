server:
  port: 9006

spring:
  application:
    name: hirehub-interview
  datasource:
    url: jdbc:mysql://localhost:3307/hirehub_interview?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  cloud:
    nacos:
      username: nacos
      password: "${NACOS_PASSWORD:nacos}"
      discovery:
        server-addr: localhost:8848
  # 三期修订（D-38）：面试提醒的延迟队列改用 Redis ZSet，不再用 RabbitMQ 消息级 TTL
  # （消息级 TTL 只在队头过期时才检查，远期提醒会堵死近期提醒 —— 见踩坑记录 #43）
  data:
    redis:
      host: localhost
      port: 6379
  # 三期：面试提醒经 MQ 转发站内通知（见 D-32）
  rabbitmq:
    host: localhost
    port: 5672
    # broker 已在容器里，跨容器连接不能用 guest（只允许 loopback）——
    # 见踩坑记录 #33 / ADR D-36。本地默认值可用环境变量覆盖。
    username: ${RABBITMQ_USERNAME:hirehub}
    password: ${RABBITMQ_PASSWORD:hirehub123}
    listener:
      simple:
        acknowledge-mode: manual   # 处理成功才 ACK，配合 interview_reminder 状态机幂等
        prefetch: 10

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

management:
  tracing:
    sampling:
      probability: 1.0   # 开发期全采样，生产按需调低

logging:
  # 落盘一份：traceId 排障 / 脚本化验证不需要盯着 IDEA 控制台（工作目录 = 项目根目录）
  file:
    name: logs/${spring.application.name}.log
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}] %-15.15t %-40.40logger{39} : %m%n%wEx"

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
