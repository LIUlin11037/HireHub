server:
  port: 9005

spring:
  application:
    name: hirehub-delivery
  datasource:
    url: jdbc:mysql://localhost:3307/hirehub_delivery?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  cloud:
    nacos:
      username: nacos
      password: "${NACOS_PASSWORD:nacos}"
      discovery:
        server-addr: localhost:8848
  # 二期：本地消息表 → RabbitMQ（见架构文档 §6.2）
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    publisher-confirm-type: correlated   # 没有 confirm 就不知道消息有没有真的到 broker
    listener:
      simple:
        acknowledge-mode: manual         # 消费端手动 ACK，配合 mq_consume_log 做幂等
        prefetch: 10
  # 二期：定时任务分布式锁（RedisLock）
  data:
    redis:
      host: localhost
      port: 6379
  task:
    scheduling:
      pool:
        size: 3                          # 投递 / 对账 / 清理三个定时任务互不阻塞

hirehub:
  mq:
    relay-interval-ms: 5000              # 本地消息扫描投递间隔

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

management:
  tracing:
    sampling:
      probability: 1.0   # 开发期全采样，生产按需调低

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}] %-15.15t %-40.40logger{39} : %m%n%wEx"